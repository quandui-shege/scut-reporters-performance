<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file:; connect-src https://api.deepseek.com; img-src 'self' file: data:; object-src 'none'; base-uri 'none'">
<title>华工学生记者团绩效统计系统</title><link rel="stylesheet" href="style.css"></head>
<body>
<dialog id="keyDialog" class="welcome"><form id="keyForm"><div class="eyebrow">REPORTERS / PERFORMANCE</div><h1>让每一份付出<br>都有据可查。</h1><p>记者团月度绩效工作台 · 本地文件协作</p><label>DeepSeek API Key<input id="apiKey" type="password" placeholder="输入你的 API Key" autocomplete="off" spellcheck="false" required></label><p class="subtle">密钥单独保存在当前浏览器本地，下次打开自动读取，不写入任何导出或交接文件。AI 整理会向 DeepSeek 发送预览中的绩效字段。</p><button class="primary" type="submit">进入工作台 →</button><p id="keyTestStatus" class="subtle" role="status"></p><button id="testKey" type="button">测试 API 连接</button><button id="clearKey" type="button">清除本地 Key</button><button id="offlineEntry" type="button" class="text-button">先离线查看与核对（调用 AI 前仍需输入 Key）</button></form></dialog>
<aside><div class="brand"><img class="brand-logo" src="assets/reporter-logo.jpg" alt="华工学生记者团团徽"><div>记者团<span>绩效统计系统</span></div></div><nav id="nav"></nav><div class="aside-foot"><button id="keySettings" type="button">API Key 设置</button><small>记者团绩效统计系统 v1</small></div></aside>
<main><header><div><div class="system-title" id="modeLabel">华工学生记者团绩效统计系统</div><h1 id="pageTitle">主页</h1></div><div class="header-actions"><button id="usageGuide" type="button">使用指南</button></div></header>
<div id="notice" role="status" aria-live="polite"></div><div id="content"></div></main>
<dialog id="editDialog"><form id="editForm"><div class="dialog-head"><h2 id="editTitle"></h2><button type="button" id="closeEdit">关闭</button></div><div id="editFields" class="form-grid"></div><div class="dialog-foot"><button type="button" id="deleteEditedMember" class="danger" hidden>删除成员</button><button type="button" id="deleteBonusProject" class="danger" hidden>删除加分项目</button><button id="editSubmit" class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="aiDialog"><h2>确认发送给 DeepSeek 的内容</h2><p>只发送下方绩效字段和用于匹配的姓名、部门。电话号码、学号、邮箱等列不会发送。原始表格本地保存，不整份上传。</p><p id="aiBatchInfo"></p><pre id="aiPreview"></pre><div class="dialog-foot"><button id="cancelAI">取消</button><button id="runAI" class="primary">开始自动整理</button></div></dialog>
<dialog id="memberPicker"><div class="dialog-head"><h2 id="memberPickerTitle">选择部门</h2><button id="closeMemberPicker" type="button">关闭</button></div><div id="memberPickerContent"></div></dialog>
<dialog id="scoreDialog"><div class="dialog-head"><h2 id="scoreTitle">确认绩效加分</h2><button id="closeScore" type="button">返回修改</button></div><p id="scoreSummary"></p><div id="scoreRows"></div><div id="scoreCalculation"></div><div class="dialog-foot"><button id="confirmScore" class="primary" type="button">确认加分</button></div></dialog>
<input id="restoreFile" type="file" accept=".zip" hidden><script src="vendor/jszip.min.js"></script><script src="vendor/xlsx.full.min.js"></script><script src="engine.js"></script><script src="score-entry.js"></script><script src="progress-store.js"></script><script src="transfer-data.js"></script><script src="share-files.js"></script><script src="app.js"></script>
</body></html>
